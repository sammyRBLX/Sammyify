name: Build Sammyify

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14

      - name: Install dependencies
        run: npm install

      - name: Build Sammyify
        run: npm run dist

      - name: Set EXE Version
        run: |
          npm install --no-save rcedit@5.0.2
          node -e "import('rcedit').then(({rcedit}) => rcedit('dist/Sammyify.exe', {
            'file-version': '1.0.2.0',
            'product-version': '1.0.2.0',
            'version-string': {
              ProductName: 'Sammyify',
              ProductVersion: '1.0.2',
              FileVersion: '1.0.2',
              CompanyName: 'Sammyify'
            }
          }))"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Sammyify-Windows
          path: dist/*.exe
