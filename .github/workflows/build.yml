name: Build Sammyify

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14

      - name: Install dependencies
        run: npm install

      - name: Build Sammyify
        run: npm run dist

      - name: Check EXE size
        shell: pwsh
        run: |
          $size = (Get-Item dist/Sammyify.exe).Length
          Write-Host "Sammyify.exe is $([math]::Round($size / 1MB, 1)) MB"
          if ($size -lt 20MB) { throw "EXE is too small - build is broken" }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Sammyify-Windows
          path: dist/*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Sammyify.exe
          generate_release_notes: true
