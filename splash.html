<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sammyify</title>
<style>
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:transparent;overflow:hidden;-webkit-user-select:none;user-select:none}
  body{font-family:'Segoe UI',Inter,system-ui,sans-serif;color:#f4f7fb}
  .card{
    position:absolute;inset:8px;border-radius:22px;
    background:radial-gradient(ellipse at 50% 0%,#0f2a3f 0%,#07121c 62%);
    border:1px solid rgba(255,255,255,.09);
    box-shadow:0 18px 50px rgba(0,0,0,.55);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
    animation:rise .55s cubic-bezier(.2,.8,.2,1) both;
    -webkit-app-region:drag;
  }
  .logo{display:flex;align-items:center;gap:14px}
  .mark{
    width:52px;height:52px;border-radius:12px;background:#f4f7fb;color:#07121c;
    font:900 30px/1 'Segoe UI',Arial,sans-serif;display:grid;place-items:center;
    transform:skewX(-6deg);box-shadow:0 0 0 0 rgba(76,201,240,.5);animation:pulse 1.8s ease-out infinite
  }
  .name{font:800 26px/1 'Segoe UI',Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase}
  .name span{color:#4cc9f0}
  .bar{width:210px;height:4px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;position:relative}
  .bar i{position:absolute;top:0;bottom:0;width:45%;border-radius:4px;
    background:linear-gradient(90deg,#4361ee,#4cc9f0);animation:slide 1.2s ease-in-out infinite}
  .status{font-size:12px;letter-spacing:.08em;color:rgba(244,247,251,.55);height:14px;position:relative;width:240px;text-align:center}
  .status span{position:absolute;left:0;right:0;opacity:0;animation:cycle 4.5s infinite}
  .status span:nth-child(2){animation-delay:1.5s}
  .status span:nth-child(3){animation-delay:3s}
  @keyframes slide{0%{left:-45%}100%{left:100%}}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(76,201,240,.45)}70%,100%{box-shadow:0 0 0 18px rgba(76,201,240,0)}}
  @keyframes rise{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
  @keyframes cycle{0%{opacity:0}8%,30%{opacity:1}38%,100%{opacity:0}}
</style>
</head>
<body>
  <div class="card">
    <div class="logo"><div class="mark">S</div><div class="name">sammy<span>ify</span></div></div>
    <div class="bar"><i></i></div>
    <div class="status"><span>Starting up…</span><span>Loading your library…</span><span>Almost ready…</span></div>
  </div>
</body>
</html>
